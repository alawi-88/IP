version: "3.9"

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: innovation
      MYSQL_USER: innovation
      MYSQL_PASSWORD: innovation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: innovation
      DB_USERNAME: innovation
      DB_PASSWORD: innovation
      REDIS_HOST: redis
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./Backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  queue:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    depends_on:
      - backend
      - redis

  scheduler:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ENDPOINT: "http://localhost:8080/api"
      INTERNAL_API_ENDPOINT: "http://nginx:80/api"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - nginx

volumes:
  db_data:
  frontend_node_modules:
